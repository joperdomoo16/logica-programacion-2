<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperaturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="card-title text-center mb-4 fs-4">Conversor de Temperatura</h1>
                        <form id="temperatureForm">
                            <div class="mb-3">
                                <label for="celsiusInput" class="form-label">Ingresa los Grados Celsius</label>
                                <input type="text" class="form-control" id="celsiusInput" placeholder="Ejemplo: 45">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Convertir</button>
                        </form>
                        
                        <div id="resultContainer" class="mt-4 d-none">
                            <h2 class="fs-5 mb-3">Resultados de la conversion:</h2>
                            <ul class="list-group">
                                <li class="list-group-item d-flex justify-content-between align-items-center bg-light">
                                    Grados Kelvin:
                                    <span id="kelvinResult" class="fw-bold text-primary"></span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center bg-light">
                                    Grados Fahrenheit:
                                    <span id="fahrenheitResult" class="fw-bold text-primary"></span>
                                </li>
                            </ul>
                        </div>

                        <div id="errorContainer" class="mt-3 alert alert-danger d-none" role="alert">
                            Error: Los datos ingresados no son un numero. Por favor vuelve a intentarlo.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
